<svg version="1.1" viewBox="0 0 1098 329" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="default">
<title lang="en">UNESCO language endangerment classification: critically endangered</title>
<style type="text/css">
	circle{
		fill: currentColor;
		stroke: #c0c0c0;
		stroke-width: 3;
	}
	line, path{
		fill: none;
		stroke: currentColor;
		stroke-width: 3;
		stroke-linecap: round;
	}
	text, .t{
		fill: currentColor;
		font-family: Arial, Helvetica, sans-serif;
		font-size: 53px;
		text-anchor: middle;
	}

	#bracket{
		stroke-width: 10;
		stroke-linejoin: round;
		stroke-linecap: butt;
	}

	/* Status label */
	.name{
		color: #000;
		font-weight: bold;
		font-size: 73px;
	}
	.invert   { color: #fff; }
	.inactive { color: rgba(0,0,0,0) !important; }

	/* Status colours */
	#cr { color: #ff4050; }
	#de { color: #f2f261; }
	#ex { color: #000; }
	#ne { color: #e5e5e5; }
	#se { color: #e80; }
	#vu { color: #97c135; }
</style>
